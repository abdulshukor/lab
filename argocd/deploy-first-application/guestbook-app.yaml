apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/abdulshukor/argocd-example-apps.git
    targetRevision: HEAD # In production use specific tag or hashes. HEAD = Latest commit
    path: helm-guestbook
  destination:
    server: https://kubernetes.default.svc # For remote cluster you need to specify. Here is local cluster.
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true # Disabling for devugginf purposes
